# Unified dataset manifest. Downloads go under data/raw/ and generated files under data/results/.
# prepare.sh creates DRGBIN01 binaries.
paper:
  title: "DRGraph: An Efficient Graph Layout Algorithm for Large-scale Graphs by Dimensionality Reduction"
  url: https://arxiv.org/abs/2008.07799
  table: 1
  dataset_count: 30

# Table 1 of the paper. The source URLs are direct downloads and the counts are checked by prepare.sh.
