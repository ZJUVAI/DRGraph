datasets:
  mnist:
    kind: data
    source: https://ossci-datasets.s3.amazonaws.com/mnist/
    files:
      - train-images-idx3-ubyte.gz
      - t10k-images-idx3-ubyte.gz
    output: mnist.data
    default_args: "--knn-k 100 --epochs 1 --samples 500 --negative 5 --output-dim 2"
  fashion-mnist:
    kind: data
    source: http://fashion-mnist.s3-website.eu-central-1.amazonaws.com/
    files:
      - train-images-idx3-ubyte.gz
      - t10k-images-idx3-ubyte.gz
    output: fashion-mnist.data
    default_args: "--knn-k 100 --epochs 1 --samples 500 --negative 5 --output-dim 2"
  sift1m:
    kind: data
    source: https://ann-benchmarks.com/sift-128-euclidean.hdf5
    source_commit: erikbern/ann-benchmarks@2e081ad32c1eccab72dcb739ad886c310b90f715
    official_source: ftp://ftp.irisa.fr/local/texmex/corpus/sift.tar.gz
    official_md5: b23d1b3b2ee8469d819b61ca900ef0ed
    official_status: Official MD5 and sift_base.fvecs value-by-value comparison passed, 2026-08-30
    output: sift1m.data
    default_args: "--knn-k 100 --epochs 1 --samples 500 --negative 5 --output-dim 2"
  troll:
    kind: graph
    source: https://sparse.tamu.edu/MM/DNVS/troll.tar.gz
    output: troll.graph
    default_args: "--epochs 1 --samples 400 --negative 5 --threads 32 --output-dim 2"
  com-orkut:
    kind: graph
    source: https://snap.stanford.edu/data/bigdata/communities/com-orkut.ungraph.txt.gz
    output: com-orkut.graph
    default_args: "--epochs 1 --samples 400 --negative 5 --threads 32 --output-dim 2"
